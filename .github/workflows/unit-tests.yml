name: Sync and PDF tests

on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt -r requirements-pdf.txt

      - name: Fetch public CJK font for identical synthetic tests on both systems
        shell: python
        run: |
          import os
          from pathlib import Path
          from urllib.request import urlretrieve
          font = Path(os.environ['RUNNER_TEMP']) / 'NotoSansCJK-Regular.ttc'
          urlretrieve('https://raw.githubusercontent.com/notofonts/noto-cjk/f8d157532fbfaeda587e826d4cd5b21a49186f7c/Sans/OTC/NotoSansCJK-Regular.ttc', font)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              env.write(f'PDF_OCR_TEST_FONT={font}\n')
              env.write('PDF_OCR_TEST_FONT_INDEX=2\n')

      - name: Run tests (live AnythingLLM is opt-in)
        run: python -m pytest tests -v -ra
